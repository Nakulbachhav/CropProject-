<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgriSathi - तुमचा मराठी शेतकरी सहायक{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Lenis Smooth Scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    
    <!-- Lottie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    
    <!-- Heroicons -->
    <script src="https://unpkg.com/heroicons@2.0.18/24/outline/index.js" type="module"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'leaf': '#16a34a',
                        'leaf-light': '#86efac',
                        'earth': '#4d3b2f',
                        'sun': '#facc15',
                        'sky': '#a7f3d0',
                        'ink': '#0b1726',
                        'glass': 'rgba(255,255,255,0.08)'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Poppins', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-sky-50 via-green-50 to-emerald-50 min-h-screen">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-green-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-leaf to-green-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                        </svg>
                    </div>
                    <span class="text-xl font-bold text-ink">AgriSathi</span>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="text-ink hover:text-leaf transition-colors">Home</a>
                    <a href="/chat" class="text-ink hover:text-leaf transition-colors">Chatbot</a>
                    <a href="/disease" class="text-ink hover:text-leaf transition-colors">Disease</a>
                    <a href="/fertilizer" class="text-ink hover:text-leaf transition-colors">Fertilizer</a>
                    <a href="/crop" class="text-ink hover:text-leaf transition-colors">Crop</a>
                    <a href="/weather" class="text-ink hover:text-leaf transition-colors">Weather</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg hover:bg-green-50">
                    <svg class="w-6 h-6 text-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden bg-white/95 backdrop-blur-md border-t border-green-100">
            <div class="px-4 py-2 space-y-1">
                <a href="/" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Home</a>
                <a href="/chat" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Chatbot</a>
                <a href="/disease" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Disease</a>
                <a href="/fertilizer" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Fertilizer</a>
                <a href="/crop" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Crop</a>
                <a href="/weather" class="block px-3 py-2 text-ink hover:text-leaf hover:bg-green-50 rounded-lg">Weather</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="pt-16">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="bg-gradient-to-r from-leaf to-green-600 text-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p class="text-green-100">AgriSathi - तुमचा मराठी शेतकरी सहायक</p>
                <p class="text-green-200 text-sm mt-2">For educational demo only</p>
            </div>
        </div>
    </footer>
    
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
